name: tcc

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: tcc-backend
    expose:
      - "8051"
    volumes:
      - ../app/frontend:/app/app/frontend:ro
    environment:
      SERVE_STATIC: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8051/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: tcc-nginx
    ports:
      - "8051:80"
    volumes:
      - ../app/frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

networks:
  default:
    name: tcc-network
