server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    log_format tcc '$remote_addr [$time_local] "$request" $status $body_bytes_sent ${request_time}s';
    access_log /var/log/nginx/access.log tcc;
    error_log /var/log/nginx/error.log warn;

    # Proxy API endpoints para o backend FastAPI
    location /api/ {
        proxy_pass http://backend:8051/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Proxy do health check
    location /health {
        proxy_pass http://backend:8051/health;
        proxy_set_header Host $host;
    }

    # Servir arquivos estáticos do frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
