<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard: Ranking de Grupos Econômicos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="layout-container">
    <header class="global-header">
        <div class="header-brand">
            <span class="header-logo">⚡</span>
            <div class="header-title-group">
                <h1 class="header-title">Ranking de Grupos Econômicos</h1>
                <span class="header-subtitle">Desempenho regulatório comparativo — REN 1000/2021</span>
            </div>
        </div>
        <nav class="main-nav-links">
            <a href="index.html">Visão Geral</a>
            <a href="transgressoes.html">Séries Temporais</a>
            <a href="mapa.html">Mapa Interativo</a>
            <a href="ranking.html" class="active">Ranking</a>
            <a href="evolucao.html">Evolução</a>
            <a href="benchmark.html">Benchmark</a>
            <a href="prompt.html">Chat IA</a>
        </nav>
        <div class="header-actions">
            <button class="theme-toggle-btn" id="theme-toggle" title="Alternar Tema">
                <span class="icon">🌙</span>
            </button>
        </div>
    </header>

    <main class="dashboard-grid">
        <aside class="sidebar-panel">
            <section class="control-card glass-panel">
                <h2 class="card-title">Filtros</h2>
                <div class="filter-group">
                    <label for="metric-select">Métrica</label>
                    <select id="metric-select" class="custom-select" style="height: auto;">
                    </select>
                </div>
                <div class="filter-group">
                    <label for="topn-select">Exibir Top</label>
                    <select id="topn-select" class="custom-select" style="height: auto;">
                        <option value="10">Top 10</option>
                        <option value="20">Top 20</option>
                        <option value="50">Top 50</option>
                        <option value="999">Todos</option>
                    </select>
                </div>
                <div class="filter-group toggle-group">
                    <label class="toggle-switch">
                        <input type="checkbox" id="asc-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span class="toggle-label">Ordem Crescente</span>
                </div>
            </section>
            <section class="insight-card glass-panel highlight-border">
                <h2 class="card-title">Resumo</h2>
                <div id="ranking-summary"></div>
            </section>
        </aside>

        <section class="main-panel-split glass-panel">
            <div class="chart-header">
                <h2 class="card-title" id="chart-title">Ranking por Métrica</h2>
            </div>
            <div class="chart-wrapper">
                <canvas id="rankingChart"></canvas>
            </div>
            <div class="table-wrapper">
                <table class="ranking-table">
                    <thead id="table-head"></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="ranking.js"></script>
</body>
</html>
